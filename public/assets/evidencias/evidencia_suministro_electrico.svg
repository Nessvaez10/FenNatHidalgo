<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Downed electrical pole / power lines -->
  <rect width="800" height="500" fill="#334155" />
  <rect x="0" y="320" width="800" height="180" fill="#1e293b" />
  
  <!-- Tilting / Downed Wooden Utility Pole -->
  <line x1="200" y1="360" x2="480" y2="280" stroke="#78350f" stroke-width="18" stroke-linecap="round" />
  <!-- Cross arm -->
  <line x1="440" y1="240" x2="470" y2="340" stroke="#78350f" stroke-width="10" />
  <!-- Ceramic Insulators -->
  <circle cx="445" cy="255" r="7" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <circle cx="465" cy="325" r="7" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  
  <!-- Sagging & Cut Power Cables sparking -->
  <path d="M 0 140 Q 240 280 445 255" stroke="#000000" stroke-width="3" fill="none" />
  <path d="M 445 255 Q 560 380 620 420" stroke="#000000" stroke-width="3" fill="none" />
  <path d="M 465 325 Q 600 370 800 240" stroke="#000000" stroke-width="3" fill="none" />
  
  <!-- Electric Arc / Sparks -->
  <polygon points="620,420 635,405 628,422 645,415 625,430" fill="#38bdf8" stroke="#f0f9ff" stroke-width="1" />
  <circle cx="628" cy="420" r="14" fill="#38bdf8" opacity="0.3" />

  <!-- CFE Danger Sign -->
  <rect x="180" y="390" width="140" height="45" rx="4" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
  <text x="190" y="410" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff">PELIGRO - ALTA TENSIÓN</text>
  <text x="190" y="424" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#fef08a">LÍNEA DESENERGIZADA</text>

  <!-- Camera HUD -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <rect x="25" y="25" width="380" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#7c3aed" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#c4b5fd">TEMA: CORTE DE SUMINISTRO ELÉCTRICO (CFE)</text>

  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5">ESTATUS OFICIAL:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#ef4444">EN PROCESO DE ATENCIÓN</text>

  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">CUADRILLA CFE EN TRASLADO | LÍNEA DE DISTRIBUCIÓN MEDIA TENSIÓN</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
