<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="calnaliSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="hillSlope" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="560" fill="url(#calnaliSky)" />

  <!-- Mountain Backdrop Calnali -->
  <polygon points="0,200 240,110 520,210 780,120 900,170 900,380 0,380" fill="url(#hillSlope)" opacity="0.8" />

  <!-- Unstable Hillside (Talud Desgajado) -->
  <polygon points="200,280 680,240 850,560 0,560" fill="#78350f" stroke="#451a03" stroke-width="2" />
  <polygon points="260,330 620,300 700,450 320,490" fill="#9a3412" opacity="0.85" />

  <!-- Rural House with Structural Risk (Vivienda Deshabitada) -->
  <g transform="translate(180, 240)">
    <!-- Base / Walls -->
    <polygon points="40,90 180,90 180,180 40,180" fill="#f8fafc" stroke="#475569" stroke-width="2" />
    <!-- Cracks on House Facade -->
    <path d="M 90 100 L 105 130 L 98 150 L 115 180" stroke="#dc2626" stroke-width="2.5" fill="none" />
    <!-- Door (Sealed / Evacuated) -->
    <rect x="110" y="120" width="35" height="60" fill="#78350f" stroke="#451a03" />
    <line x1="105" y1="130" x2="150" y2="170" stroke="#ef4444" stroke-width="3" />
    <line x1="105" y1="170" x2="150" y2="130" stroke="#ef4444" stroke-width="3" />
    <!-- Window -->
    <rect x="55" y="115" width="30" height="30" fill="#38bdf8" opacity="0.7" stroke="#334155" />
    <!-- Roof with slope -->
    <polygon points="20,90 110,35 200,90" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
  </g>

  <!-- Ground Fissures / Grietas en Terreno -->
  <path d="M 120 440 L 220 450 L 320 435 L 480 465 L 620 440 L 800 480" stroke="#451a03" stroke-width="6" fill="none" />
  <path d="M 280 450 L 310 490 L 360 520" stroke="#451a03" stroke-width="4" fill="none" />
  <path d="M 520 460 L 560 510 L 600 535" stroke="#451a03" stroke-width="4" fill="none" />

  <!-- Police / Civil Protection Caution Tape (Cinta de Acordonamiento) -->
  <g transform="translate(60, 410)">
    <line x1="0" y1="0" x2="800" y2="20" stroke="#facc15" stroke-width="12" />
    <text x="60" y="6" font-family="monospace" font-size="8" font-weight="bold" fill="#000000">PELIGRO - ZONA DE DESLAVE - PROTECCIÓN CIVIL HIDALGO</text>
    <text x="440" y="13" font-family="monospace" font-size="8" font-weight="bold" fill="#000000">PROHIBIDO EL PASO - RIESGO DE COLAPSO</text>
  </g>

  <!-- Technical Overlay HUD -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(30, 30)">
    <rect width="490" height="58" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#ea580c" stroke-width="2" />
    <circle cx="24" cy="29" r="10" fill="#ea580c" />
    <text x="44" y="26" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="900" fill="#f8fafc">FICHA ESPECÍFICA • CALNALI, HGO.</text>
    <text x="44" y="45" font-family="Montserrat, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fdba74">BARRIO AHUIMOL • DESLAVE ACTIVO Y VIVIENDA EVACUADA</text>
  </g>

  <!-- Status Badge -->
  <g transform="translate(620, 30)">
    <rect width="250" height="58" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#dc2626" stroke-width="2" />
    <text x="35" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5">OPERATIVO PREVENTIVO</text>
    <text x="35" y="46" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="900" fill="#ef4444">VIVIENDA DESHABITADA</text>
  </g>

  <!-- Bottom Data Strip -->
  <g transform="translate(30, 495)">
    <rect width="840" height="38" rx="5" fill="#090d16" fill-opacity="0.92" stroke="#334155" stroke-width="1" />
    <text x="20" y="23" font-family="monospace" font-size="10" fill="#cbd5e1">
      <tspan fill="#f97316" font-weight="bold">MEDIDA DE SEGURIDAD:</tspan> Evacuación preventiva de habitantes • Inspección geotécnica de ladera por Protección Civil
    </text>
    <text x="730" y="23" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="bold" fill="#f87171">ZONA CORDONADA</text>
  </g>
</svg>
