<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="50%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
  </defs>

  <!-- Sky & Storm Fog -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <path d="M 0 160 Q 200 130 400 150 T 800 140 L 800 280 L 0 280 Z" fill="#64748b" opacity="0.3" />

  <!-- Mountain Slopes -->
  <polygon points="0,70 240,280 0,340" fill="url(#mountain1)" />
  <polygon points="120,40 540,320 0,380" fill="url(#mountain2)" />
  <polygon points="360,110 780,340 180,410" fill="#1e293b" opacity="0.85" />

  <!-- Road -->
  <polygon points="0,380 800,340 800,500 0,500" fill="#1c1917" />
  <!-- Road Yellow Centerline -->
  <path d="M 0 450 L 320 425" stroke="#f59e0b" stroke-width="4" stroke-dasharray="25,18" />
  <path d="M 460 415 L 800 395" stroke="#f59e0b" stroke-width="4" stroke-dasharray="25,18" />

  <!-- Massive Landslide / Derrumbe blocking the road -->
  <path d="M 220 280 Q 280 340 330 380 Q 380 430 460 440 Q 540 435 580 400 Q 640 370 700 350 L 620 310 Q 480 300 360 260 Z" fill="url(#rockGrad)" />
  <polygon points="320,380 380,360 410,400 340,420" fill="#44403c" stroke="#1c1917" stroke-width="2" />
  <polygon points="420,390 480,370 510,420 440,435" fill="#57534e" stroke="#1c1917" stroke-width="2" />
  <polygon points="380,410 430,420 415,445 365,435" fill="#78716c" />
  <polygon points="490,410 545,395 560,430 505,440" fill="#44403c" />

  <!-- Broken Trees and Debris -->
  <line x1="280" y1="340" x2="350" y2="395" stroke="#713f12" stroke-width="6" stroke-linecap="round" />
  <line x1="390" y1="365" x2="470" y2="405" stroke="#854d0e" stroke-width="5" stroke-linecap="round" />

  <!-- Yellow Highway Warning Cones / Barricade -->
  <polygon points="230,450 245,410 255,410 270,450" fill="#ea580c" />
  <rect x="238" y="426" width="24" height="6" fill="#ffffff" />
  <polygon points="590,430 605,390 615,390 630,430" fill="#ea580c" />
  <rect x="598" y="406" width="24" height="6" fill="#ffffff" />

  <!-- Civil Protection Inspection Patrol / Truck Outline -->
  <g transform="translate(80, 395)">
    <!-- Vehicle Body -->
    <rect x="0" y="20" width="110" height="35" rx="5" fill="#ffffff" stroke="#691c32" stroke-width="2" />
    <path d="M 60 20 L 80 5 L 105 5 L 110 20 Z" fill="#e2e8f0" stroke="#691c32" stroke-width="1.5" />
    <rect x="0" y="32" width="110" height="10" fill="#691c32" />
    <!-- Wheels -->
    <circle cx="25" cy="55" r="12" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <circle cx="85" cy="55" r="12" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <!-- Emergency Light Bar -->
    <rect x="80" y="1" width="20" height="4" rx="2" fill="#f59e0b" />
    <rect x="80" y="1" width="10" height="4" fill="#dc2626" />
    <text x="8" y="40" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#ffffff">PROTECCIÓN CIVIL</text>
  </g>

  <!-- Technical Camera HUD Overlay -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <!-- Corner Reticles -->
  <path d="M 25 45 L 25 25 L 45 25" stroke="#ffffff" stroke-width="2" fill="none" />
  <path d="M 775 45 L 775 25 L 755 25" stroke="#ffffff" stroke-width="2" fill="none" />
  <path d="M 25 455 L 25 475 L 45 475" stroke="#ffffff" stroke-width="2" fill="none" />
  <path d="M 775 455 L 775 475 L 755 475" stroke="#ffffff" stroke-width="2" fill="none" />

  <!-- Official Tag Header -->
  <rect x="25" y="25" width="370" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#f59e0b" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="0.5">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#fcd34d">TEMA: DERRUMBES EN CARRETERAS Y CAMINOS</text>

  <!-- Timestamp & Status Badge -->
  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5">ESTATUS OFICIAL:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#ef4444">EN PROCESO DE ATENCIÓN</text>

  <!-- Bottom Coordinates & Watermark Bar -->
  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">COORD: 20°54'N 98°39'W | SICT / SIPDUS HIDALGO | REGISTRO FOTOGRÁFICO DE CAMPO</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
