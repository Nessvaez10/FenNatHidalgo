<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Temporary Shelter / Refugio Temporal -->
  <rect width="800" height="500" fill="#f1f5f9" />
  <rect x="0" y="340" width="800" height="160" fill="#e2e8f0" stroke="#cbd5e1" />
  
  <!-- Shelter Hall Pillars & Windows -->
  <rect x="80" y="40" width="640" height="300" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <line x1="80" y1="120" x2="720" y2="120" stroke="#f1f5f9" stroke-width="2" />
  
  <!-- Cots / Colchonetas dispuestas para damnificados -->
  <g transform="translate(140, 260)">
    <rect x="0" y="0" width="110" height="45" rx="5" fill="#3b82f6" />
    <rect x="5" y="5" width="25" height="35" rx="3" fill="#ffffff" />
    <rect x="35" y="5" width="70" height="35" rx="3" fill="#60a5fa" />
  </g>
  <g transform="translate(340, 260)">
    <rect x="0" y="0" width="110" height="45" rx="5" fill="#3b82f6" />
    <rect x="5" y="5" width="25" height="35" rx="3" fill="#ffffff" />
    <rect x="35" y="5" width="70" height="35" rx="3" fill="#60a5fa" />
  </g>
  <g transform="translate(540, 260)">
    <rect x="0" y="0" width="110" height="45" rx="5" fill="#3b82f6" />
    <rect x="5" y="5" width="25" height="35" rx="3" fill="#ffffff" />
    <rect x="35" y="5" width="70" height="35" rx="3" fill="#60a5fa" />
  </g>

  <!-- DIF / PC Medical Supply Boxes -->
  <rect x="140" y="370" width="45" height="40" fill="#f8fafc" stroke="#dc2626" stroke-width="2" />
  <line x1="162" y1="380" x2="162" y2="400" stroke="#dc2626" stroke-width="4" />
  <line x1="152" y1="390" x2="172" y2="390" stroke="#dc2626" stroke-width="4" />

  <!-- Camera HUD -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <rect x="25" y="25" width="380" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#e11d48" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#fda4af">TEMA: REFUGIOS TEMPORALES Y AUXILIO SOCIAL</text>

  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#f59e0b" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#fef08a">OPERATIVO ACTIVO:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#eab308">HABILITADO PREVENTIVO</text>

  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">SISTEMA DIF HIDALGO / PROTECCIÓN CIVIL | ATENCIÓN A FAMILIAS EVACUADAS</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
