<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Structural damage to school/bridge wall -->
  <rect width="800" height="500" fill="#475569" />
  
  <!-- Concrete Wall Structure with Severe Diagonal Fractures -->
  <rect x="80" y="80" width="640" height="340" fill="#e2e8f0" stroke="#334155" stroke-width="4" />
  <!-- Concrete Expansion Joints -->
  <line x1="280" y1="80" x2="280" y2="420" stroke="#94a3b8" stroke-width="3" />
  <line x1="500" y1="80" x2="500" y2="420" stroke="#94a3b8" stroke-width="3" />
  
  <!-- Massive Structural Crack (Fisura en X / Falla de cortante) -->
  <path d="M 180 90 L 260 210 L 390 280 L 480 390 L 520 420" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 260 210 L 210 320 L 160 380" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 390 280 L 460 200 L 580 140" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Exposed Rebar / Varillas expuestas -->
  <line x1="380" y1="270" x2="410" y2="290" stroke="#b45309" stroke-width="4" />
  <line x1="250" y1="200" x2="275" y2="225" stroke="#b45309" stroke-width="4" />

  <!-- Support Shoring / Puntales de Madera preventivos -->
  <line x1="330" y1="420" x2="380" y2="280" stroke="#78350f" stroke-width="12" />
  <line x1="450" y1="420" x2="410" y2="280" stroke="#78350f" stroke-width="12" />

  <!-- Official Suspension / Red Alert Seal -->
  <rect x="320" y="160" width="160" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="3" rx="4" />
  <text x="330" y="185" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="900" fill="#991b1b">CLAUSURADO</text>
  <text x="330" y="202" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">RIESGO ESTRUCTURAL</text>
  <text x="330" y="218" font-family="Montserrat, Arial, sans-serif" font-size="8" fill="#7f1d1d">EVACUACIÓN INMEDIATA</text>

  <!-- Camera HUD -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <rect x="25" y="25" width="380" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#7c3aed" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#c4b5fd">TEMA: DAÑO ESTRUCTURAL EN INMUEBLE / PUENTE</text>

  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5">ESTATUS OFICIAL:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#ef4444">EN PROCESO DE ATENCIÓN</text>

  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">DICTAMEN PERICIAL INGENIERÍA CIVIL | VALORACIÓN DE RIESGO DE COLAPSO</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
