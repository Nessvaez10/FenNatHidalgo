<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Preventive Monitoring / Drone or field survey -->
  <rect width="800" height="500" fill="#1e293b" />
  <!-- Mountain ranges in mist -->
  <polygon points="0,150 250,80 500,160 800,100 800,340 0,340" fill="#334155" opacity="0.7" />
  <polygon points="0,220 340,160 620,240 800,190 800,420 0,420" fill="#475569" />
  <polygon points="0,320 800,300 800,500 0,500" fill="#0f172a" />

  <!-- Radar Sweep / Scanning Sector Grid -->
  <circle cx="400" cy="250" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.5" />
  <circle cx="400" cy="250" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  <line x1="400" y1="70" x2="400" y2="430" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
  <line x1="220" y1="250" x2="580" y2="250" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Geological Target Box -->
  <rect x="340" y="200" width="120" height="100" fill="none" stroke="#f59e0b" stroke-width="2" />
  <text x="350" y="220" font-family="monospace" font-size="9" font-weight="bold" fill="#facc15">TALUD SERRANO</text>
  <text x="350" y="235" font-family="monospace" font-size="8" fill="#f8fafc">SATURACIÓN: 92%</text>

  <!-- Camera HUD -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <rect x="25" y="25" width="380" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#0284c7" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#7dd3fc">TEMA: MONITOREO PREVENTIVO Y TELEMETRÍA</text>

  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#0284c7" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#bae6fd">ESTATUS OPERATIVO:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">VIGILANCIA ACTIVA</text>

  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">ESTACIÓN HIDROLÓGICA Y DRON DE MONITOREO | CENTRO DE OPERACIONES C5i</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
