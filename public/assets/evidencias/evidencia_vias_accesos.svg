<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Restricting road to single lane / detour -->
  <rect width="800" height="500" fill="#334155" />
  <!-- Two lane mountain pass road -->
  <polygon points="100,500 280,180 520,180 700,500" fill="#1e293b" />
  <!-- Center line -->
  <line x1="400" y1="180" x2="400" y2="500" stroke="#f59e0b" stroke-width="6" stroke-dasharray="30,20" />
  
  <!-- Right lane blocked by rock fall with single-lane passage flaggers -->
  <path d="M 400 320 Q 520 280 650 340 L 700 500 L 400 500 Z" fill="#57534e" />
  <polygon points="460,400 520,360 580,420 500,450" fill="#292524" />
  
  <!-- Orange Drums & Single Lane Warning Sign -->
  <g transform="translate(350, 240)">
    <polygon points="20,0 40,35 0,35" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">!</text>
  </g>
  <rect x="240" y="360" width="120" height="50" rx="4" fill="#facc15" stroke="#000000" stroke-width="2" />
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#000000">UN SOLO CARRIL</text>
  <text x="250" y="396" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#b45309">PASO INTERMITENTE</text>

  <!-- Camera HUD -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <rect x="25" y="25" width="380" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#7c3aed" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#c4b5fd">TEMA: VÍAS Y ACCESOS RESTRINGIDOS</text>

  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5">ESTATUS OFICIAL:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#ef4444">EN PROCESO DE ATENCIÓN</text>

  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">OPERATIVO VIAL SIPDUS / GUARDIA NACIONAL | CONTROL DE TRÁFICO</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
