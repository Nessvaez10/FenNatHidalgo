<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Urban Inundation / Encharcamientos -->
  <rect width="800" height="500" fill="#64748b" />
  <!-- Buildings -->
  <rect x="40" y="80" width="120" height="280" fill="#475569" stroke="#334155" />
  <rect x="180" y="120" width="160" height="240" fill="#334155" />
  <rect x="520" y="100" width="220" height="260" fill="#475569" />
  
  <!-- Windows -->
  <g fill="#fef08a" opacity="0.6">
    <rect x="60" y="110" width="20" height="25" />
    <rect x="100" y="110" width="20" height="25" />
    <rect x="60" y="160" width="20" height="25" />
    <rect x="100" y="160" width="20" height="25" />
    <rect x="210" y="150" width="30" height="30" />
    <rect x="270" y="150" width="30" height="30" />
  </g>

  <!-- Heavy Flood Water layer (Tirante de agua) -->
  <rect x="0" y="300" width="800" height="200" fill="#1e3a8a" opacity="0.85" />
  <path d="M 0 300 Q 200 290 400 300 T 800 295 L 800 500 L 0 500 Z" fill="#1e40af" />
  <!-- Muddy surface reflection -->
  <path d="M 0 320 Q 300 305 600 325 T 800 315" stroke="#93c5fd" stroke-width="3" fill="none" opacity="0.6" />

  <!-- Trapped Vehicle partially submerged -->
  <g transform="translate(360, 310)">
    <!-- Car body above water -->
    <path d="M 20 50 L 50 15 L 130 15 L 160 50 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <rect x="0" y="45" width="190" height="35" rx="5" fill="#ef4444" />
    <!-- Submerged wheels indication -->
    <path d="M 0 70 L 190 70 L 190 90 L 0 90 Z" fill="#1e3a8a" opacity="0.9" />
  </g>

  <!-- Camera HUD -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <rect x="25" y="25" width="380" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#0284c7" stroke-width="1.5" />
  <text x="38" y="44" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">EVIDENCIA FOTOGRÁFICA DE INCIDENCIA</text>
  <text x="38" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#7dd3fc">TEMA: INUNDACIONES Y ENCHARCAMIENTOS SEVEROS</text>

  <rect x="610" y="25" width="165" height="48" rx="4" fill="#1e293b" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.5" />
  <text x="622" y="44" font-family="monospace" font-size="10" font-weight="bold" fill="#fca5a5">ESTATUS OFICIAL:</text>
  <text x="622" y="60" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="800" fill="#ef4444">EN PROCESO DE ATENCIÓN</text>

  <rect x="25" y="445" width="750" height="30" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="38" y="464" font-family="monospace" font-size="10" fill="#94a3b8">OPERATIVO VACTOR / MOTOBOMBAS | EVACUACIÓN DE VIALIDAD Y AUXILIO VIAL</text>
  <text x="650" y="464" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="bold" fill="#fbbf24">EXP: CORTE OFICIAL</text>
</svg>
