<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="otomiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cloudForest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="560" fill="url(#otomiSky)" />

  <!-- Cloud Forest Hills (Región Otomí-Tepehua) -->
  <polygon points="0,180 200,90 450,170 720,80 900,160 900,380 0,380" fill="url(#cloudForest)" opacity="0.8" />
  <rect x="0" y="140" width="900" height="60" fill="#f8fafc" opacity="0.3" filter="blur(8px)" />

  <!-- Eco-Park Entrance Archway (Parador Ecoturístico Fuerza y Esperanza) -->
  <g transform="translate(420, 240)">
    <!-- Wooden Columns -->
    <rect x="-180" y="0" width="28" height="180" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <rect x="180" y="0" width="28" height="180" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <!-- Rustic Wood Lintel -->
    <polygon points="-210,0 240,0 230,-35 -200,-35" fill="#92400e" stroke="#451a03" stroke-width="2" />
    <rect x="-160" y="-28" width="340" height="22" fill="#451a03" rx="3" />
    <text x="10" y="-12" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="900" fill="#fef3c7" text-anchor="middle" letter-spacing="1">PARADOR ECOTURÍSTICO FUERZA Y ESPERANZA</text>
  </g>

  <!-- Access Road with Curve -->
  <polygon points="200,410 640,410 780,560 60,560" fill="#334155" stroke="#1e293b" stroke-width="2" />
  <!-- Retaining stones and side cleared mud -->
  <path d="M 600 480 Q 670 430 740 450 T 850 560 Z" fill="#78350f" opacity="0.7" />
  <path d="M 120 510 Q 180 470 230 490 T 260 560 Z" fill="#57534e" opacity="0.6" />

  <!-- Protective Barrier & Cones along the Edge -->
  <line x1="220" y1="410" x2="620" y2="410" stroke="#facc15" stroke-width="3" stroke-dasharray="14,10" />

  <!-- Technical Overlay HUD -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <g transform="translate(30, 30)">
    <rect width="490" height="58" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#16a34a" stroke-width="2" />
    <circle cx="24" cy="29" r="10" fill="#16a34a" />
    <text x="44" y="26" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="900" fill="#f8fafc">FICHA ESPECÍFICA • HUEHUETLA, HGO.</text>
    <text x="44" y="45" font-family="Montserrat, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#86efac">ACCESO AL PARADOR ECOTURÍSTICO FUERZA Y ESPERANZA</text>
  </g>

  <g transform="translate(630, 30)">
    <rect width="240" height="58" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#16a34a" stroke-width="2" />
    <text x="35" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#86efac">TARJETA SSPCyGR-158</text>
    <text x="35" y="46" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="900" fill="#4ade80">CAMINO REABIERTO</text>
  </g>

  <g transform="translate(30, 495)">
    <rect width="840" height="38" rx="5" fill="#090d16" fill-opacity="0.92" stroke="#334155" stroke-width="1" />
    <text x="20" y="23" font-family="monospace" font-size="10" fill="#cbd5e1">
      <tspan fill="#4ade80" font-weight="bold">INSPECCIÓN TÉCNICA:</tspan> Protección Civil Estatal y Municipal • Despeje de derrumbe completado sin afectación a turistas
    </text>
    <text x="710" y="23" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">PASO NORMALIZADO</text>
  </g>
</svg>
