<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="mistSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="rockCliff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
  </defs>

  <!-- Foggy Sierra Sky -->
  <rect width="900" height="560" fill="url(#mistSky)" />

  <!-- Mountain Slopes & Mist -->
  <polygon points="0,150 350,60 700,160 900,110 900,320 0,320" fill="#1e3a1e" opacity="0.6" />
  <rect x="0" y="160" width="900" height="80" fill="#e2e8f0" opacity="0.4" />

  <!-- Steep Cut Cliff on Right (Ladera Desgajada) -->
  <polygon points="520,120 900,90 900,560 560,560 530,340" fill="url(#rockCliff)" stroke="#1c1917" stroke-width="3" />
  <!-- Rock Texture & Fractures -->
  <line x1="600" y1="180" x2="680" y2="340" stroke="#a8a29e" stroke-width="3" />
  <line x1="720" y1="150" x2="790" y2="290" stroke="#78716c" stroke-width="2.5" />
  <line x1="580" y1="360" x2="720" y2="430" stroke="#57534e" stroke-width="4" />

  <!-- Federal Highway 105 (México - Tampico) Asphalting Curve -->
  <polygon points="0,320 540,320 620,560 0,560" fill="#1e293b" />
  <line x1="0" y1="440" x2="570" y2="440" stroke="#eab308" stroke-width="5" stroke-dasharray="25,18" />

  <!-- Pile of Cleared Rocks & Debris on Shoulder -->
  <path d="M 460 520 Q 520 420 580 430 T 700 560 Z" fill="#44403c" stroke="#292524" stroke-width="2" />
  <polygon points="490,480 540,430 570,490" fill="#78716c" />
  <polygon points="560,460 620,440 640,510" fill="#a8a29e" />

  <!-- Front Loader / Heavy Machinery Silhouette (Operativo de Despeje) -->
  <g transform="translate(260, 360)">
    <!-- Tractor Body -->
    <rect x="50" y="30" width="110" height="50" rx="5" fill="#f59e0b" stroke="#000000" stroke-width="2" />
    <!-- Cabin -->
    <polygon points="80,30 130,30 115,-15 85,-15" fill="#0284c7" stroke="#000000" stroke-width="2" />
    <!-- Amber Beacon Light -->
    <rect x="95" y="-22" width="10" height="7" fill="#fbbf24" stroke="#d97706" />
    <!-- Wheels -->
    <circle cx="70" cy="80" r="28" fill="#1c1917" stroke="#000000" stroke-width="4" />
    <circle cx="145" cy="80" r="24" fill="#1c1917" stroke="#000000" stroke-width="4" />
    <!-- Loader Arm & Bucket -->
    <polygon points="150,45 210,55 240,75 220,85 150,60" fill="#d97706" />
    <polygon points="230,45 255,85 240,95 215,65" fill="#334155" />
  </g>

  <!-- Highway Milestone Marker (Km 172) -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="38" height="65" rx="19" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <text x="19" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">KM</text>
    <text x="19" y="52" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">172</text>
  </g>

  <!-- Traffic Cones -->
  <g transform="translate(140, 480)">
    <polygon points="12,0 0,35 24,35" fill="#ea580c" />
    <rect x="3" y="14" width="18" height="7" fill="#ffffff" />
    <rect x="-3" y="35" width="30" height="5" fill="#1e293b" />
  </g>
  <g transform="translate(200, 490)">
    <polygon points="12,0 0,35 24,35" fill="#ea580c" />
    <rect x="3" y="14" width="18" height="7" fill="#ffffff" />
    <rect x="-3" y="35" width="30" height="5" fill="#1e293b" />
  </g>

  <!-- Technical Overlay HUD -->
  <rect x="20" y="20" width="860" height="520" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(30, 30)">
    <rect width="490" height="58" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#d97706" stroke-width="2" />
    <circle cx="24" cy="29" r="10" fill="#d97706" />
    <text x="44" y="26" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="900" fill="#f8fafc">FICHA ESPECÍFICA • TLANCHINOL, HGO.</text>
    <text x="44" y="45" font-family="Montserrat, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fcd34d">CARRETERA FEDERAL MÉXICO-TAMPICO KM 172 "LA VIRGENCITA"</text>
  </g>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(630, 30)">
    <rect width="240" height="58" rx="6" fill="#0f172a" fill-opacity="0.92" stroke="#16a34a" stroke-width="2" />
    <text x="35" y="26" font-family="monospace" font-size="10" font-weight="bold" fill="#86efac">TARJETA SSPCyGR-156</text>
    <text x="35" y="46" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="900" fill="#4ade80">VIALIDAD LIBERADA (100%)</text>
  </g>

  <!-- Bottom Data Strip -->
  <g transform="translate(30, 495)">
    <rect width="840" height="38" rx="5" fill="#090d16" fill-opacity="0.92" stroke="#334155" stroke-width="1" />
    <text x="20" y="23" font-family="monospace" font-size="10" fill="#cbd5e1">
      <tspan fill="#f59e0b" font-weight="bold">COORDINACIÓN:</tspan> Protección Civil Tlanchinol • Policía Municipal • Policía Estatal • Guardia Nacional (17/07 08:30 h)
    </text>
    <text x="710" y="23" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">PASO SEGURO</text>
  </g>
</svg>
